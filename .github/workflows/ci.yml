name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ["5.1", "5.4", "luajit-2.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install busted
      - run: make test BUSTED=busted

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz | tar xz -C "$HOME"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: make typecheck LUALS=lua-language-server
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua spec
      - uses: lunarmodules/luacheck@v1
        with:
          args: lua spec

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cds-lua-fp
      # mini.doc beside the rock, where the Makefile looks first
      - uses: actions/checkout@v7
        with:
          repository: nvim-mini/mini.doc
          path: mini.doc
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Help file is current
        run: make doc-check
        working-directory: cds-lua-fp
